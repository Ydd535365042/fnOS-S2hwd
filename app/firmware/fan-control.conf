# =============================================================
# /etc/fan-control.conf —— 风扇控制默认配置
#
# 三档温控策略（对齐 s2 fan-ui）：
#   TEMP_PROFILE=quiet        节能/安静预设（低转速、晚触发）
#   TEMP_PROFILE=performance  性能预设（早触发、高转速）
#   TEMP_PROFILE=custom       自定义（使用下面 T1..T4 / D2/D3 锚点）
#
# 曲线语义（两路独立，最终取较高转速百分比）：
#   temp <= T1        -> D1%（固定 30%，起转下限）
#   T1 < temp < T2    -> D1% -> D2% 线性插值
#   T2 < temp < T3    -> D2% -> D3% 线性插值
#   T3 < temp < T4    -> D3% -> D4% 线性插值
#   temp >= T4        -> D4%（固定 100%，全速）
# =============================================================

# 温控策略：quiet | performance | custom
TEMP_PROFILE=quiet

# ---- 硬盘路温控曲线（4 锚点线性插值，单位 ℃ / %）----
# 安静预设默认：42/48/52/55 -> 30/30/70/100
# T4 天花板 55℃：机械盘长期 55℃ 以上老化明显加快，
# 早 5℃ 全速换来的噪声，比换盘便宜。
HDD_T1=42
HDD_T2=48
HDD_T3=52
HDD_T4=55
HDD_D2=30      # T2 处转速 %（T1 固定 30，T4 固定 100）
HDD_D3=70      # T3 处转速 %

# ---- CPU 路温控曲线（4 锚点线性插值）----
# 安静预设默认：60/65/72/80 -> 30/30/70/100
CPU_T1=60
CPU_T2=65
CPU_T3=72
CPU_T4=80
CPU_D2=30
CPU_D3=70

# ---- 风扇电气参数 ----
FAN_DUTY_MIN=30      # 起转占空比 %（T1 锚点下限，低于此风扇可能停转）
PWM_PERIOD=40000     # 25kHz
PWM_POLARITY=normal
USE_GPIO_FORCE=0     # 1=强制用 GPIO 备用方案

# ---- 采样 ----
CHECK_INTERVAL=3         # 采样间隔（秒）
TEMP_DEBOUNCE_CNT=2      # 连续 N 次目标占空比不同才真正调整（去抖）
HDD_SMART_CYCLES=10      # 每 N 个周期使用受保护的 SMART 采集（10×3s=30s）
HDD_SMART_TIMEOUT=8      # 单次 smartctl 超时（秒）
